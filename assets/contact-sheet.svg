<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101010"/><stop offset="1" stop-color="#1A1512"/></linearGradient>
  <pattern id="grain" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r=".7" fill="#F4EBDD" opacity=".05"/></pattern>
</defs>
<rect width="1200" height="420" rx="28" fill="url(#bg)"/>
<rect width="1200" height="420" rx="28" fill="url(#grain)"/>
<rect x="18" y="18" width="1164" height="384" rx="20" fill="none" stroke="#F4EBDD" stroke-opacity=".16" stroke-width="2"/>

<text x="48" y="64" fill="#F4EBDD" font-family="Impact,Arial Black,sans-serif" font-size="38">CONTACT SHEET / CURRENT PRODUCTIONS</text>

<g transform="translate(48 100)">
  <g>
    <rect width="330" height="250" rx="16" fill="#090909" stroke="#F4EBDD" stroke-opacity=".16"/>
    <text x="24" y="42" fill="#D72638" font-family="Courier New,monospace" font-size="14">FRAME 01</text>
    <text x="24" y="88" fill="#F4EBDD" font-family="Arial Black,sans-serif" font-size="31">SKILLRADAR</text>
    <text x="24" y="124" fill="#B8AFA6" font-family="Georgia,serif" font-size="18" font-style="italic">Job-market intelligence</text>
    <text x="24" y="151" fill="#B8AFA6" font-family="Georgia,serif" font-size="18" font-style="italic">+ resume-gap analysis</text>
    <rect x="24" y="190" width="280" height="6" rx="3" fill="#26211D"/>
    <rect x="24" y="190" width="218" height="6" rx="3" fill="#D72638">
      <animate attributeName="width" values="40;218;180;235;218" dur="4.2s" repeatCount="indefinite"/>
    </rect>
    <text x="24" y="224" fill="#F4EBDD" font-family="Courier New,monospace" font-size="13">IN DEVELOPMENT</text>
  </g>

  <g transform="translate(386 0)">
    <rect width="330" height="250" rx="16" fill="#090909" stroke="#F4EBDD" stroke-opacity=".16"/>
    <text x="24" y="42" fill="#F2B134" font-family="Courier New,monospace" font-size="14">FRAME 02</text>
    <text x="24" y="88" fill="#F4EBDD" font-family="Arial Black,sans-serif" font-size="31">DEMANDSHOCK</text>
    <text x="24" y="124" fill="#B8AFA6" font-family="Georgia,serif" font-size="18" font-style="italic">Crisis-aware demand</text>
    <text x="24" y="151" fill="#B8AFA6" font-family="Georgia,serif" font-size="18" font-style="italic">forecasting system</text>
    <rect x="24" y="190" width="280" height="6" rx="3" fill="#26211D"/>
    <rect x="24" y="190" width="154" height="6" rx="3" fill="#F2B134">
      <animate attributeName="width" values="32;154;122;174;154" dur="4.8s" repeatCount="indefinite"/>
    </rect>
    <text x="24" y="224" fill="#F4EBDD" font-family="Courier New,monospace" font-size="13">RESEARCH + BUILD</text>
  </g>

  <g transform="translate(772 0)">
    <rect width="330" height="250" rx="16" fill="#090909" stroke="#F4EBDD" stroke-opacity=".16"/>
    <text x="24" y="42" fill="#8EBA6F" font-family="Courier New,monospace" font-size="14">FRAME 03</text>
    <text x="24" y="88" fill="#F4EBDD" font-family="Arial Black,sans-serif" font-size="31">LOCKIN AI</text>
    <text x="24" y="124" fill="#B8AFA6" font-family="Georgia,serif" font-size="18" font-style="italic">Accountability and</text>
    <text x="24" y="151" fill="#B8AFA6" font-family="Georgia,serif" font-size="18" font-style="italic">execution platform</text>
    <rect x="24" y="190" width="280" height="6" rx="3" fill="#26211D"/>
    <rect x="24" y="190" width="102" height="6" rx="3" fill="#8EBA6F">
      <animate attributeName="width" values="28;102;78;126;102" dur="5.2s" repeatCount="indefinite"/>
    </rect>
    <text x="24" y="224" fill="#F4EBDD" font-family="Courier New,monospace" font-size="13">PROTOTYPING</text>
  </g>
</g>
</svg>