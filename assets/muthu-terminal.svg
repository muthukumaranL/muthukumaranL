<svg
  width="1200"
  height="360"
  viewBox="0 0 1200 360"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1200" y2="360">
      <stop offset="0%" stop-color="#050505"/>
      <stop offset="55%" stop-color="#0b1008"/>
      <stop offset="100%" stop-color="#111805"/>
    </linearGradient>

    <radialGradient id="screenGlow" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#9EF01A" stop-opacity="0.11"/>
      <stop offset="60%" stop-color="#7FB800" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#050505" stop-opacity="0"/>
    </radialGradient>

    <pattern
      id="scanlines"
      width="4"
      height="4"
      patternUnits="userSpaceOnUse"
    >
      <rect width="4" height="2" fill="#000000" fill-opacity="0.18"/>
    </pattern>

    <filter id="greenGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>

    <clipPath id="terminalClip">
      <rect x="36" y="34" width="1128" height="292" rx="13"/>
    </clipPath>
  </defs>

  <rect width="1200" height="360" rx="18" fill="url(#background)"/>
  <rect
    x="20"
    y="18"
    width="1160"
    height="324"
    rx="18"
    fill="#080A07"
    stroke="#26351C"
    stroke-width="2"
  />

  <rect
    x="36"
    y="34"
    width="1128"
    height="292"
    rx="13"
    fill="#050705"
    stroke="#5A7A24"
    stroke-opacity="0.65"
  />

  <rect
    x="36"
    y="34"
    width="1128"
    height="292"
    rx="13"
    fill="url(#screenGlow)"
  />

  <g clip-path="url(#terminalClip)">
    <circle cx="230" cy="180" r="210" fill="#9EF01A" opacity="0.025">
      <animate
        attributeName="r"
        values="190;235;190"
        dur="5s"
        repeatCount="indefinite"
      />
      <animate
        attributeName="opacity"
        values="0.015;0.055;0.015"
        dur="5s"
        repeatCount="indefinite"
      />
    </circle>

    <circle
      cx="940"
      cy="210"
      r="150"
      fill="#7FB800"
      opacity="0.035"
      filter="url(#softGlow)"
    >
      <animate
        attributeName="cx"
        values="900;980;900"
        dur="8s"
        repeatCount="indefinite"
      />
    </circle>

    <g opacity="0.15" stroke="#9EF01A">
      <path d="M0 270 L1200 270"/>
      <path d="M0 285 L1200 285"/>
      <path d="M0 300 L1200 300"/>
      <path d="M0 315 L1200 315"/>
      <path d="M150 250 L70 326"/>
      <path d="M280 250 L210 326"/>
      <path d="M410 250 L350 326"/>
      <path d="M540 250 L490 326"/>
      <path d="M670 250 L630 326"/>
      <path d="M800 250 L770 326"/>
      <path d="M930 250 L910 326"/>
      <path d="M1060 250 L1050 326"/>
    </g>

    <rect width="1200" height="360" fill="url(#scanlines)" opacity="0.42"/>

    <rect x="-400" y="0" width="180" height="360" fill="#9EF01A" opacity="0.025">
      <animate
        attributeName="x"
        values="-400;1400"
        dur="7s"
        repeatCount="indefinite"
      />
    </rect>

    <g font-family="'Courier New', monospace">
      <text x="74" y="78" fill="#61704F" font-size="16">
        MUTHU_LABS_BOOT_SEQUENCE
      </text>

      <text x="74" y="112" fill="#9EF01A" font-size="18">
        &gt; initializing identity_core...
      </text>

      <text x="74" y="143" fill="#9EF01A" font-size="18">
        &gt; loading artificial_intelligence...
      </text>

      <text x="74" y="174" fill="#9EF01A" font-size="18">
        &gt; loading data_intelligence...
      </text>

      <text x="74" y="205" fill="#9EF01A" font-size="18">
        &gt; loading visual_storytelling...
      </text>

      <text
        x="74"
        y="265"
        fill="#EAFBD2"
        font-size="46"
        font-weight="700"
        letter-spacing="4"
        filter="url(#greenGlow)"
      >
        MUTHU KUMARAN
        <animate
          attributeName="opacity"
          values="1;1;0.82;1;0.93;1"
          keyTimes="0;0.72;0.75;0.78;0.8;1"
          dur="4.8s"
          repeatCount="indefinite"
        />
      </text>

      <text
        x="77"
        y="298"
        fill="#9EF01A"
        font-size="16"
        letter-spacing="3"
      >
        AI SYSTEMS // DATA // DESIGN // STORIES
      </text>

      <text x="880" y="78" fill="#9EF01A" font-size="15">
        STATUS
      </text>

      <circle cx="952" cy="73" r="6" fill="#9EF01A" filter="url(#greenGlow)">
        <animate
          attributeName="opacity"
          values="1;0.2;1"
          dur="1.3s"
          repeatCount="indefinite"
        />
      </circle>

      <text x="970" y="78" fill="#EAFBD2" font-size="15">
        ONLINE
      </text>

      <text x="880" y="112" fill="#61704F" font-size="13">
        LOCATION: TORONTO
      </text>

      <text x="880" y="138" fill="#61704F" font-size="13">
        MODE: BUILDING
      </text>

      <text x="880" y="164" fill="#61704F" font-size="13">
        SIGNAL: STABLE
      </text>

      <rect x="880" y="192" width="210" height="8" rx="4" fill="#1C2415"/>
      <rect x="880" y="192" width="168" height="8" rx="4" fill="#9EF01A">
        <animate
          attributeName="width"
          values="35;168;142;190;168"
          dur="5s"
          repeatCount="indefinite"
        />
      </rect>
    </g>

    <rect x="664" y="227" width="18" height="42" fill="#9EF01A">
      <animate
        attributeName="opacity"
        values="1;0;1"
        dur="0.8s"
        repeatCount="indefinite"
      />
    </rect>

    <g opacity="0">
      <rect x="34" y="100" width="1130" height="4" fill="#9EF01A"/>
      <animate
        attributeName="opacity"
        values="0;0;0.7;0;0"
        keyTimes="0;0.88;0.9;0.92;1"
        dur="5.4s"
        repeatCount="indefinite"
      />
      <animateTransform
        attributeName="transform"
        type="translate"
        values="0 0;0 0;18 -9;-9 5;0 0"
        keyTimes="0;0.88;0.9;0.92;1"
        dur="5.4s"
        repeatCount="indefinite"
      />
    </g>
  </g>

  <circle cx="53" cy="51" r="5" fill="#FF5F57"/>
  <circle cx="72" cy="51" r="5" fill="#FEBC2E"/>
  <circle cx="91" cy="51" r="5" fill="#28C840"/>
</svg>
